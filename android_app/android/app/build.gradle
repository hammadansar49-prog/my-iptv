plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.veo.iptvplayer.iptv_player"
    compileSdk = flutter.compileSdkVersion
    // No plugin here compiles native code from source (media_kit ships
    // prebuilt .so files) — leaving ndkVersion unset skips Gradle's
    // auto-download of a many-hundred-MB NDK package that isn't needed,
    // which was failing repeatedly on this network (TLS corruption on the
    // big download, unrelated to this project).

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // flutter_local_notifications requires this (Java 8+ APIs backported
        // to run on the minSdk 24 floor this app still supports).
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    defaultConfig {
        applicationId = "com.veo.iptvplayer.iptvplayer"
        // media_kit requires minSdk 21 — set explicitly rather than relying
        // on flutter.minSdkVersion which could be lower.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Replace with a proper release keystore before publishing to Play Store.
            // Generate one with: keytool -genkey -v -keystore release.keystore -alias iptv -keyalg RSA -keysize 2048 -validity 10000
            // Then add signingConfigs.release block and reference it here.
            signingConfig = signingConfigs.debug
            // Enable R8 code shrinking for smaller APK and basic obfuscation.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
