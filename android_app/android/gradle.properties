# Flutter's template ships -Xmx8G -XX:MaxMetaspaceSize=4G. On this build
# machine the Gradle daemon JVM crashed at startup trying to reserve that
# much virtual space:
#
#   Native memory allocation (mmap) failed to map 1254096896 bytes
#   Out of Memory Error (os_windows.cpp:3926)
#
# The build does not need 8GB — these values are sized to actually fit, which
# is the root-cause fix rather than retrying the same build and hoping.
# Raise them again on a machine with the headroom.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# One worker at a time. Parallel module builds each fork their own JVM, which
# is exactly the memory pressure that killed the daemon.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true

android.useAndroidX=true
