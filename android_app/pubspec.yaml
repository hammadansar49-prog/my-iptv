name: theottdeals
description: TheOttDeals IPTV for Android and Android TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management — see spec §6. Riverpod keeps state out of widgets and
  # lets large lists (channels/movies/EPG) read a stable provider without
  # rebuilding their ancestors.
  flutter_riverpod: ^2.6.1

  # Navigation — declarative, predictable back stack (spec §52).
  go_router: ^14.6.2

  # Networking. Timeouts, cancel tokens and redirect limits matter here; the
  # PC app's fetchText used 45s + 5 redirects + a size cap (see AUDIT.md §2).
  dio: ^5.7.0
  connectivity_plus: ^6.1.0

  # Storage. Credentials go in secure storage (spec §7/§51); bulk local data
  # (favorites, history, downloads, cached catalog) in a plain JSON store.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5

  # Player — libmpv. NOT video_player/ExoPlayer: see CLAUDE.md and AUDIT.md §8.
  # The historical 1.2.5 pin on media_kit_video existed because 1.3.0+ needs a
  # Flutter engine with SurfaceProducer.Callback; this toolchain is 3.41.9,
  # far past that, so the pin is lifted deliberately.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Images — cached, downscaled to the card size (spec §48).
  cached_network_image: ^3.4.1

  # Misc
  intl: ^0.19.0
  crypto: ^3.0.6
  device_info_plus: ^11.1.1
  package_info_plus: ^8.1.1
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  screen_brightness: ^2.1.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
